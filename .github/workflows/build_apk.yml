
name: Build THE LAHORE ACADAMY JHANG Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m flet --version

      - name: Build Android APK
        run: |
          yes | flet build apk --project the_lahore_academy_jhang --org com.thelahoreacademy.jhang --product "THE LAHORE ACADAMY JHANG"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Lahore-Academy-Jhang-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
